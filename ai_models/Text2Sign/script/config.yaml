project:
  name: "kobart-finetune"
  seed: 42
  output_dir: "outputs/exp_001"
  logging_dir: "outputs/exp_001/logs"

data:
  train_path: "ml/kobart/data/train.jsonl"
  val_path: "ml/kobart/data/valid.jsonl"
  test_path: "ml/kobart/data/test.jsonl"
  text_col: "src"
  label_col: "tgt"

model:
  pretrained_name: "gogamza/kobart-base-v2"
  tokenizer_name: "gogamza/kobart-base-v2"
  max_source_length: 256
  max_target_length: 256
  padding: "max_length"
  truncation: true

train:
  epochs: 3
  train_batch_size: 8
  eval_batch_size: 2
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  fp16: true
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

eval:
  do_eval: true
  eval_strategy: "steps"      # "epoch"도 가능
  eval_steps: 200
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 3
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  predict_with_generate: true
  generation_max_length: 256
  generation_num_beams: 4

runtime:
  num_workers: 2
  report_to: "tensorboard"    # "wandb" / "none"
  # 모델 학습 시 : none -> tensorboard 로 설정 후 진행
